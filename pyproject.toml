[project]
name = "linesman-bench"
version = "0.1.0"
description = "Linesman by Archee Studio: a benchmark for generated 2D drafting sheets"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["ezdxf>=1.4,<2", "pydantic>=2.9,<3"]

[project.scripts]
linesman = "linesman.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linesman"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
